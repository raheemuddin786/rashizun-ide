services:
  # Self-MCP Server (Bridge between IDE and Agents)
  mcp-core-server:
    build:
      context: ./services/mcp
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    container_name: rashizun-mcp-core
    volumes:
      - ./.rashizun/ledger.json:/app/ledger.json
      - ./package.json:/app/package.json
      - ./scripts:/app/scripts
    environment:
      - RAG_ENGINE_URL=http://rag-engine:7200
    stdin_open: true
    tty: false
    networks:
      - rashizun-net

  # Skill Registry (Custom MCP tools/agents)
  skill-registry:
    build:
      context: ./services/skills
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    container_name: rashizun-skills
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "7201"]
    volumes:
      - ./services/skills/repo:/app/skills
    networks:
      - rashizun-net

networks:
  rashizun-net:
    driver: bridge
