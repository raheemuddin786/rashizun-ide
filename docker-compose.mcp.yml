services:
  # Self-MCP Server (Bridge between IDE and Agents)
  mcp-core-server:
    build:
      context: ./services/mcp
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    container_name: rashizun-mcp-core
    volumes:
      - ./.rashizun/ledger.json:/app/ledger.json
      - ./package.json:/app/package.json
      - ./scripts:/app/scripts
    environment:
      - RAG_SERVICE_URL=http://rag-engine:7200
      - SKILLS_SERVICE_URL=http://skill-registry:7201
    ports:
      - "7100:7100"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7100/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - rashizun-net

  # Skill Registry (Custom MCP tools/agents)
  skill-registry:
    build:
      context: ./services/skills
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    container_name: rashizun-skills
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "7201"]
    volumes:
      - ./services/skills/repo:/app/skills
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7201/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - rashizun-net

networks:
  rashizun-net:
    driver: bridge
