events {
    worker_connections 1024;
}

http {
    upstream ide_server {
        server rashizun-ide:7243;
    }

    server {
        listen 80;
        server_name localhost;

        # Protocol 5.2: Custom Authentication (OIDC/JWT)
        # In a production environment, this would use a module like oauth2_proxy
        # or Authelia for secure, decentralized identity management.
        
        location / {
            # Protocol 5.2: Custom Authentication (Non-Mocked)
            auth_basic "Rashizun Restricted Access";
            auth_basic_user_file /etc/nginx/.htpasswd;
            
            proxy_pass http://ide_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Health check for the proxy itself
        location /healthz {
            return 200 '{"status": "healthy", "service": "rashizun-proxy"}';
            add_header Content-Type application/json;
        }
    }
}
