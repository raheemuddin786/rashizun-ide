worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Protocol 5.3: Runtime DNS Resolution
    # This allows Nginx to start even if backends are not yet ready
    resolver 127.0.0.11 valid=30s;

    upstream ide_server {
        server rashizun-ide:7243;
    }

    server {
        listen 80;
        server_name localhost;

        # Standard VS Code Web IDE Location
        location / {
            auth_basic "Rashizun Restricted Access";
            auth_basic_user_file /etc/nginx/.htpasswd;
            
            proxy_pass http://ide_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Protocol 5.3: MCP Orchestration Bridge
        location /mcp-api/ {
            auth_basic "Rashizun MCP Bridge";
            auth_basic_user_file /etc/nginx/.htpasswd;
            
            # Using a variable forces Nginx to resolve the hostname at runtime
            set $mcp_backend http://mcp-core-server:7100;
            
            rewrite ^/mcp-api/(.*) /$1 break;
            proxy_pass $mcp_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /healthz {
            return 200 '{"status": "healthy", "service": "rashizun-proxy"}';
            add_header Content-Type application/json;
        }
    }
}
