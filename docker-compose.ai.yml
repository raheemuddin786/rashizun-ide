version: '3.8'

services:
  # RAG Indexing and Retrieval Service
  rag-engine:
    build:
      context: ./services/rag
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    container_name: rashizun-rag
    volumes:
      - ./data/lancedb:/app/data
      - ./workspace:/app/workspace
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - LANCEDB_PATH=/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - rashizun-net

networks:
  rashizun-net:
    driver: bridge
