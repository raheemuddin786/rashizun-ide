
include:
  - path: docker-compose.ai.yml
  - path: docker-compose.mcp.yml

services:
  rashizun-ide:
    build:
      context: .
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    container_name: rashizun-ide
    command: ["./bin/rashizun-server", "--host", "0.0.0.0", "--port", "7243", "--connection-token", "rashizun-token"]
    # Internal port only, public access is via proxy
    expose:
      - "7243"
    volumes:
      - ./workspace:/app/workspace
      - ./.rashizun:/app/.rashizun
      - ./data/chroma:/app/data/chroma
      - ./extensions/rashizun-core:/app/extensions/rashizun-core
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - RASHIZUN_MODE=WebOrchestrator
    depends_on:
      - rag-engine
      - mcp-core-server
    networks:
      - rashizun-net

  # Protocol 5.1/5.2: Secure Proxy & Auth Gateway
  rashizun-proxy:
    image: nginx:alpine
    container_name: rashizun-proxy
    volumes:
      - ./services/proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./services/proxy/.htpasswd:/etc/nginx/.htpasswd:ro
    ports:
      - "8080:80"
    depends_on:
      - rashizun-ide
    networks:
      - rashizun-net

networks:
  rashizun-net:
    driver: bridge
